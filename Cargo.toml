[package]
name = "pag"
version = "0.1.0"
edition = "2021"
description = "PaganLinux Package Manager — wielojęzyczny menedżer pakietów z obsługą migawek"
authors = ["PaganLinux Team"]
license = "GPL-3.0-or-later"
repository = "https://github.com/PaganLinux/pag"
homepage = "https://paganlinux.eu"
keywords = ["package-manager", "linux", "paganlinux", "lfs"]
categories = ["command-line-utilities", "os"]

[[bin]]
name = "pag"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "color", "string"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Async runtime & HTTP
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"

# Hashing & crypto
sha2 = "0.10"
md-5 = "0.10"
blake3 = "1.5"
ring = "0.17"
base64 = "0.22"

# GPG
gpgme = "0.11"
sequoia-openpgp = { version = "1.21", optional = true }

# Archive handling
flate2 = "1.0"
tar = "0.4"
xz2 = "0.1"
zstd = { version = "0.13", features = ["zstdmt"] }
bzip2 = "0.4"
lzma-rs = "0.3"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
sled = "0.34"

# Filesystem & paths
dirs = "5.0"
tempfile = "3.10"
walkdir = "2.5"
glob = "0.3"
fs2 = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Terminal UI
colored = "2.1"
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
crossterm = "0.28"

# Parsing
regex = "1.11"
nom = "7.1"
pest = "2.7"
pest_derive = "2.7"

# Time
chrono = { version = "0.4", features = ["serde"] }
humantime = "2.1"

# Miscellaneous
uuid = { version = "1.11", features = ["v4"] }
lazy_static = "1.5"
once_cell = "1.20"
nix = { version = "0.29", features = ["user"] }
num_cpus = "1.16"

[features]
default = ["gpg"]
gpg = []
sequoia = ["sequoia-openpgp"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.dev]
opt-level = 0
