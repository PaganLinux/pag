# ────────────────────────────────────────────────────────────────────────────────
# pag.conf — Przykładowa konfiguracja PaganLinux Package Manager
# Umieść w: /etc/pag/pag.conf
# ────────────────────────────────────────────────────────────────────────────────

[general]
lang = "pl"                         # Domyślny język: pl, en, de, fr, es
arch = "x86_64"                     # Architektura systemu
color = true                        # Kolorowe wyjście
parallel_downloads = 5              # Równoległe pobieranie
compression = "zstd"                # Kompresja pakietów: zstd, xz, gzip, bzip2
compression_level = 19              # Poziom kompresji (1-22 dla zstd)
auto_clean_cache = false            # Automatyczne czyszczenie cache

[repositories]
check_updates_on_start = true       # Sprawdzaj aktualizacje przy starcie pag
check_interval_hours = 24           # Interwał sprawdzania w godzinach

[[repositories.repos]]
name = "core"
url = "https://pagrepos.paganlinux.eu/x86_64"
enabled = true
trust_level = 100
sig_level = "required"
gpg_key = "0xPAGANLINUX2024"

[[repositories.repos]]
name = "community"
url = "https://pagrepos.paganlinux.eu/community/x86_64"
enabled = true
trust_level = 80
sig_level = "optional"
gpg_key = "0xCOMMUNITY2024"

[build]
cflags = "-march=native -O2 -pipe -fstack-protector-strong -fno-plt"
cxxflags = "-march=native -O2 -pipe -fstack-protector-strong -fno-plt"
makeopts = "-j$(nproc)"
build_dir = "/var/tmp/pag/build"
use_namespace = true
max_log_size = 100                  # MB

[snapshots]
enabled = true
snapshot_type = "btrfs"             # btrfs, zfs, rsync
auto_pre = true                     # Automatyczna migawka przed operacjami
auto_post = true                    # Automatyczna migawka po operacjach
max_snapshots = 20
prefix = "pag"

[gpg]
keyring_dir = "/etc/pag/gnupg"
auto_key_retrieve = false
keyserver = "hkps://keys.openpgp.org"

[paths]
db_path = "/var/lib/pag/db"
cache_path = "/var/cache/pag"
pkg_cache_path = "/var/cache/pag/pkgs"
build_path = "/var/tmp/pag/build"
keyring_path = "/etc/pag/gnupg"
snapshot_path = "/var/lib/pag/snapshots"
lock_path = "/var/lib/pag/db.lock"
tmp_path = "/tmp/pag"
log_path = "/var/log/pag"

[network]
timeout_secs = 30
max_retries = 3
user_agent = "pag/0.1.0 (PaganLinux)"
verify_ssl = true
